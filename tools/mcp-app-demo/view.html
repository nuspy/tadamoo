<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey</title>
<style>
  /* the host's variables when it gives them, these when it does not */
  :root {
    --color-background-primary: light-dark(#ffffff, #1a2128);
    --color-background-secondary: light-dark(#f1f3f5, #232c35);
    --color-text-primary: light-dark(#171717, #e9ecee);
    --color-text-secondary: light-dark(#555b61, #aab2b9);
    --color-border-primary: light-dark(#cfd4d9, #3a4651);
    --color-text-danger: light-dark(#b3261e, #ff8a80);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --border-radius-md: 8px;
    color-scheme: light dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font-family: var(--font-sans); font-size: 16px; line-height: 1.5; background: var(--color-background-primary); color: var(--color-text-primary); }
  h1 { margin: 0 0 8px; font-size: 1.15rem; }
  fieldset { border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-md); margin: 0 0 12px; padding: 8px 12px; }
  legend { padding: 0 6px; color: var(--color-text-secondary); }
  label.opt { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  input[type=radio] { width: 22px; height: 22px; }
  input[type=number] { width: 6em; min-height: 44px; font: inherit; padding: 0 8px; background: var(--color-background-secondary); color: inherit; border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-md); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
  button { min-height: 44px; min-width: 44px; padding: 0 14px; font: inherit; color: inherit; background: var(--color-background-secondary); border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-md); cursor: pointer; }
  button.primary { background: #ff7a3d; color: #1a1a1a; border-color: #ff7a3d; }
  svg { display: block; width: 100%; max-height: 220px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); }
  #status { min-height: 1.5em; color: var(--color-text-secondary); }
  #status.bad { color: var(--color-text-danger); }
  .small { color: var(--color-text-secondary); font-size: 0.875rem; }
</style>
</head>
<body>
<h1 id="title">Survey</h1>
<fieldset id="choices"><legend>Your choice</legend><div id="options"></div></fieldset>
<div class="row"><label for="n">Points</label><input id="n" type="number" min="3" max="30" value="8"><button id="update" type="button">Update the chart</button></div>
<svg id="chart" viewBox="0 0 300 120" role="img" aria-label="Chart of the series"></svg>
<div class="row">
  <button id="tell" type="button" class="primary">Tell the model my choice</button>
  <button id="save" type="button">Save</button>
  <button id="say" type="button">Send as a message</button>
  <button id="link" type="button">Open the docs</button>
  <button id="mode" type="button">Fullscreen</button>
  <button id="done" type="button">Done</button>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div class="small" id="info"></div>
<script>
(() => {
  "use strict";
  let nextId = 1, context = {}, input = {}, series = [], mode = "inline";
  const pending = new Map(), $ = id => document.getElementById(id);
  const say = (text, bad) => { $("status").textContent = text; $("status").className = bad ? "bad" : ""; };
  const post = msg => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => { const id = nextId++; pending.set(id, { resolve, reject }); post({ id, method, params }); });
  const notify = (method, params) => post({ method, params: params || {} });

  function applyContext(c) {
    context = { ...context, ...c };
    if (c.theme) document.documentElement.dataset.theme = c.theme;
    const vars = (c.styles && c.styles.variables) || {};
    for (const k of Object.keys(vars)) if (vars[k]) document.documentElement.style.setProperty(k, vars[k]);
    if (c.displayMode) { mode = c.displayMode; $("mode").textContent = mode === "fullscreen" ? "Back" : "Fullscreen"; }
    $("info").textContent = ["theme " + (context.theme || "-"), "locale " + (context.locale || "-"), "zone " + (context.timeZone || "-"), "platform " + (context.platform || "-"),
      "mode " + mode, "safe " + JSON.stringify(context.safeAreaInsets || {}), "box " + JSON.stringify(context.containerDimensions || {})].join(" | ");
  }
  function drawOptions() {
    const box = $("options"); box.replaceChildren();
    (input.options || ["Yes", "No"]).forEach((o, i) => {
      const l = document.createElement("label"); l.className = "opt";
      const r = document.createElement("input"); r.type = "radio"; r.name = "choice"; r.value = o; r.checked = i === 0;
      l.append(r, document.createTextNode(o)); box.append(l);
    });
    $("title").textContent = input.title || "Survey";
  }
  function drawChart() {
    const svg = $("chart"), W = 300, H = 120, pts = series.length ? series : [0];
    const max = Math.max(...pts, 1), min = Math.min(...pts, 0), span = max - min || 1;
    const xy = pts.map((v, i) => [10 + i * (W - 20) / Math.max(pts.length - 1, 1), H - 10 - (v - min) / span * (H - 20)]);
    svg.innerHTML = "<polyline fill='none' stroke='#ff7a3d' stroke-width='2' points='" + xy.map(p => p.join(",")).join(" ") + "'/>" + xy.map(p => "<circle r='3' cx='" + p[0] + "' cy='" + p[1] + "' fill='#ff7a3d'/>").join("");
  }
  const choice = () => (document.querySelector("input[name=choice]:checked") || {}).value || "";
  const must = async (p, okText) => { try { const r = await p; if (okText) say(okText); return r; } catch (e) { say(String(e.message || e), true); return null; } };

  window.addEventListener("message", ev => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method === undefined) {                                          // an answer to one of our requests
      const w = pending.get(m.id); if (!w) return; pending.delete(m.id);
      if (m.error) w.reject(new Error(m.error.message || "error")); else w.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-input") { input = (m.params || {}).arguments || {}; drawOptions(); }
    else if (m.method === "ui/notifications/tool-input-partial") { input = { ...input, ...((m.params || {}).arguments || {}) }; drawOptions(); }
    else if (m.method === "ui/notifications/tool-result") { const r = m.params || {}; series = ((r.structuredContent || {}).series) || []; drawChart(); say("Result received"); }
    else if (m.method === "ui/notifications/tool-cancelled") say("The tool was cancelled: " + ((m.params || {}).reason || ""), true);
    else if (m.method === "ui/notifications/host-context-changed") applyContext(m.params || {});
    else if (m.method === "ui/resource-teardown") { say("Closing"); post({ id: m.id, result: {} }); }
    else if (m.id !== undefined) post({ id: m.id, error: { code: -32601, message: "Method not found: " + m.method } });
  });

  $("update").onclick = () => must(request("tools/call", { name: "compute_series", arguments: { n: Number($("n").value) || 8 } }).then(r => { series = (r.structuredContent || {}).series || []; drawChart(); return r; }), "Chart updated");
  $("tell").onclick = () => must(request("ui/update-model-context", { content: [{ type: "text", text: "The person chose: " + choice() }], structuredContent: { choice: choice(), points: series.length } }), "The model will know your choice");
  $("save").onclick = () => must(request("tools/call", { name: "save_answers", arguments: { choice: choice() } }).then(r => { say("Saved: " + ((r.content || [])[0] || {}).text); return r; }), "");
  $("say").onclick = () => must(request("ui/message", { role: "user", content: { type: "text", text: "I chose " + choice() + " in the survey." } }), "Message sent");
  $("link").onclick = () => must(request("ui/open-link", { url: "https://modelcontextprotocol.io/extensions/apps/overview" }), "Link opened");
  $("mode").onclick = () => must(request("ui/request-display-mode", { mode: mode === "fullscreen" ? "inline" : "fullscreen" }).then(r => { applyContext({ displayMode: r.mode }); return r; }), "");
  $("done").onclick = () => notify("ui/notifications/request-teardown");

  const report = () => { const html = document.documentElement, was = html.style.height; html.style.height = "max-content"; const height = Math.ceil(html.getBoundingClientRect().height); html.style.height = was; notify("ui/notifications/size-changed", { width: Math.ceil(html.getBoundingClientRect().width), height }); };
  new ResizeObserver(report).observe(document.body);
  drawOptions(); drawChart();
  request("ui/initialize", { appInfo: { name: "Survey", version: "1.0.0" }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen", "pip"] }, protocolVersion: "2026-01-26" })
    .then(r => { applyContext(r.hostContext || {}); notify("ui/notifications/initialized"); notify("notifications/message", { level: "info", data: "survey ready" }); })
    .catch(e => say("Could not start: " + e.message, true));
})();
</script>
</body>
</html>
