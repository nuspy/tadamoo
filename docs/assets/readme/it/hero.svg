<text x="60" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#ece8df" text-anchor="start" opacity="0.92">TaDaMoo trasforma un modello linguistico in un collaboratore che agisce:</text>
<text x="60" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#ece8df" text-anchor="start" opacity="0.92">lavora sui tuoi file, naviga, telefona, pianifica, ricorda, e</text>
<text x="60" y="326" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#ece8df" text-anchor="start" opacity="0.92">chiede prima di fare qualcosa che non si può disfare.</text>
